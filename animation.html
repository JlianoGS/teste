<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #rocket{
            position: fixed;
            animation: lancamento 5s linear 0s infinite;
        }
        @keyframes lancamento {
            0%{
                top: 100vh;
            }
            100%{
                top: -10vh;
            }
        }
        #potato1{
            width: 50px;
            animation: girar 3s cubic-bezier(.1,.8,1,.26) 0s 5s;
        }
        @keyframes girar {
            0%{
                transform: rotate(0deg);
            }
            100%{
                transform: rotate(360deg);
            }
            
        }
    </style>
</head>
<body>
    <img id="potato1" src="potato1.png" alt="">
    <p id="rocket">🚀</p>
</body>
</html>
